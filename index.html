<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Carousel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f2;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    .carousel {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .slide {
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 18px;
      background: white;
    }

    .slide img {
      width: 100%;
      height: 520px;
      object-fit: cover;
    }

    .slide-content {
      width: 100%;
      padding: 60px;
    }

    .slide-content h1 {
      margin: 0 0 20px;
      font-size: clamp(32px, 6vw, 72px);
    }

    .slide-content p {
      max-width: 620px;
      font-size: 20px;
      line-height: 1.6;
    }

    .slide-content a {
      display: inline-block;
      margin-top: 18px;
      color: white;
      background: #171717;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: #171717;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      padding: 0;
      background: #c5c5c5;
    }

    .dot.active {
      background: #171717;
    }

    @media (max-width: 600px) {
      .carousel {
        padding: 12px;
      }

      .slide,
      .slide img {
        min-height: 420px;
        height: 420px;
      }

      .slide-content {
        padding: 32px;
      }

      .slide-content p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="carousel">
    <section id="slide" class="slide"></section>

    <div class="controls">
      <button id="previous" aria-label="Previous slide">←</button>
      <div id="dots" class="dots"></div>
      <button id="next" aria-label="Next slide">→</button>
    </div>
  </main>

  <script>
    const slides = [
      {
        type: "image",
        image: "images/project-1.jpg",
        alt: "Project one preview"
      },
      {
        type: "text",
        title: "Brand identity",
        text: "A visual identity system designed to make a new creative studio feel confident, warm, and memorable.",
        linkText: "View project",
        linkUrl: "#"
      },
      {
        type: "image",
        image: "images/project-2.jpg",
        alt: "Project two preview"
      },
      {
        type: "both",
        image: "images/project-3.jpg",
        alt: "Project three preview",
        title: "Digital experience",
        text: "A responsive web experience focused on clarity, rhythm, and ease of navigation.",
        linkText: "Read case study",
        linkUrl: "#"
      }
    ];

    let currentSlide = 0;

    const slideElement = document.getElementById("slide");
    const dotsElement = document.getElementById("dots");

    function renderSlide() {
      const item = slides[currentSlide];

      if (item.type === "image") {
        slideElement.innerHTML = `
          <img src="${item.image}" alt="${item.alt}">
        `;
      } else {
        slideElement.innerHTML = `
          <div class="slide-content">
            ${item.type === "both"
              ? `<img src="${item.image}" alt="${item.alt}" style="width:100%; max-height:260px; object-fit:cover; border-radius:12px; margin-bottom:28px;">`
              : ""
            }
            <h1>${item.title}</h1>
            <p>${item.text}</p>
            ${item.linkUrl ? `<a href="${item.linkUrl}">${item.linkText}</a>` : ""}
          </div>
        `;
      }

      dotsElement.innerHTML = slides.map((_, index) => `
        <button
          class="dot ${index === currentSlide ? "active" : ""}"
          onclick="goToSlide(${index})"
          aria-label="Go to slide ${index + 1}">
        </button>
      `).join("");
    }

    function goToSlide(index) {
      currentSlide = (index + slides.length) % slides.length;
      renderSlide();
    }

    document.getElementById("previous").onclick = () => {
      goToSlide(currentSlide - 1);
    };

    document.getElementById("next").onclick = () => {
      goToSlide(currentSlide + 1);
    };

    renderSlide();
  </script>
</body>
</html>
