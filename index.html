<script>
const CONFIG = {
  githubOwner: "boofruit",
  githubRepository: "Portfolio\_ImageScroll",
  branch: "main",
  rootFolder: "sets"
};

  let projects = [];
  let activeProject = 0;
  let activePhoto = 0;

  const slideElement = document.getElementById("slide");
  const dotsElement = document.getElementById("dots");
  const carouselElement = document.querySelector(".carousel");

  const projectPicker = document.createElement("select");
  projectPicker.setAttribute("aria-label", "Choose project");
  projectPicker.style.cssText = `
    display: block;
    width: 100%;
    max-width: 300px;
    margin: 0 auto 16px;
    padding: 10px 12px;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    background: white;
    font-size: 16px;
  `;

  carouselElement.prepend(projectPicker);

  function encodePath(path) {
    return path
      .split("/")
      .map(part => encodeURIComponent(part))
      .join("/");
  }

  async function getGitHubContents(path) {
    const url =
      `https://api.github.com/repos/` +
      `${CONFIG.githubOwner}/${CONFIG.githubRepository}/contents/` +
      `${encodePath(path)}?ref=${encodeURIComponent(CONFIG.branch)}`;

    const response = await fetch(url, {
      headers: {
        Accept: "application/vnd.github+json"
      }
    });

    if (!response.ok) {
      throw new Error(`GitHub request failed: ${response.status}`);
    }

    return response.json();
  }

  function isImage(filename) {
    return /\.(jpg|jpeg|png|gif|webp|avif)$/i.test(filename);
  }

  function sortFiles(a, b) {
    return a.name.localeCompare(b.name, undefined, {
      numeric: true,
      sensitivity: "base"
    });
  }

  function formatProjectName(name) {
    return name
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, character => character.toUpperCase());
  }

  async function discoverProjects() {
    const rootItems = await getGitHubContents(CONFIG.rootFolder);

    const folders = rootItems
      .filter(item => item.type === "dir")
      .sort((a, b) => a.name.localeCompare(b.name));

    const discoveredProjects = await Promise.all(
      folders.map(async folder => {
        const contents = await getGitHubContents(folder.path);

        const photos = contents
          .filter(item => item.type === "file" && isImage(item.name))
          .sort(sortFiles);

        return {
          name: folder.name,
          photos
        };
      })
    );

    return discoveredProjects.filter(project => project.photos.length > 0);
  }

  function renderProjectPicker() {
    projectPicker.replaceChildren();

    projects.forEach((project, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = formatProjectName(project.name);
      projectPicker.appendChild(option);
    });

    projectPicker.value = activeProject;
  }

  function renderSlide() {
    const project = projects[activeProject];
    const photo = project.photos[activePhoto];

    slideElement.replaceChildren();

    const image = document.createElement("img");
    image.src = photo.download_url;
    image.alt = `${formatProjectName(project.name)} image ${activePhoto + 1}`;

    slideElement.appendChild(image);

    dotsElement.replaceChildren();

    project.photos.forEach((_, index) => {
      const dot = document.createElement("button");

      dot.className = `dot ${index === activePhoto ? "active" : ""}`;
      dot.setAttribute("aria-label", `Go to photo ${index + 1}`);

      dot.addEventListener("click", () => {
        activePhoto = index;
        renderSlide();
      });

      dotsElement.appendChild(dot);
    });
  }

  function showMessage(message) {
    slideElement.innerHTML = `
      <div style="
        padding: 40px;
        text-align: center;
        font-family: Arial, sans-serif;
      ">
        ${message}
      </div>
    `;
  }

  document.getElementById("previous").addEventListener("click", () => {
    const project = projects[activeProject];

    activePhoto =
      (activePhoto - 1 + project.photos.length) %
      project.photos.length;

    renderSlide();
  });

  document.getElementById("next").addEventListener("click", () => {
    const project = projects[activeProject];

    activePhoto =
      (activePhoto + 1) %
      project.photos.length;

    renderSlide();
  });

  projectPicker.addEventListener("change", event => {
    activeProject = Number(event.target.value);
    activePhoto = 0;
    renderSlide();
  });

  async function startCarousel() {
    try {
      showMessage("Loading projects…");

      projects = await discoverProjects();

      if (projects.length === 0) {
        showMessage("No project folders with images were found.");
        return;
      }

      const requestedProject =
        new URLSearchParams(window.location.search).get("project");

      const requestedIndex = projects.findIndex(
        project => project.name === requestedProject
      );

      if (requestedIndex >= 0) {
        activeProject = requestedIndex;
      }

      renderProjectPicker();
      renderSlide();
    } catch (error) {
      console.error(error);
      showMessage("Unable to load projects from GitHub.");
    }
  }

  startCarousel();
</script>
