<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Carousel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f2;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    .carousel {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .project-picker {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto 16px;
      padding: 10px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }

 .slide {
  min-height: 520px;
  display: grid;
  overflow: hidden;
  border-radius: 18px;
  background: white;
}

.slide.text-right,
.slide.text-left {
  grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr);
}

.slide.text-right .slide-media {
  order: 1;
}

.slide.text-right .slide-copy {
  order: 2;
}

.slide.text-left .slide-media {
  order: 2;
}

.slide.text-left .slide-copy {
  order: 1;
}

.slide.text-top,
.slide.text-bottom {
  grid-template-columns: 1fr;
  grid-template-rows: auto auto;
}

.slide.text-top .slide-copy {
  order: 1;
}

.slide.text-top .slide-media {
  order: 2;
}

.slide.text-bottom .slide-media {
  order: 1;
}

.slide.text-bottom .slide-copy {
  order: 2;
}

.slide.image-only {
  display: block;
}

.slide.text-only {
  display: flex;
  align-items: center;
}

.slide-media {
  height: 520px;
  min-height: 0;
  overflow: hidden;
  background: #e9e9e5;
}

.slide-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform-origin: center center;
  transition: transform 250ms ease;
}

.slide-copy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 42px;
}

.slide-copy h1 {
  margin: 0 0 18px;
  font-size: clamp(28px, 4vw, 52px);
  line-height: 1.05;
}

.slide-copy p {
  margin: 0;
  font-size: 18px;
  line-height: 1.6;
}

@media (max-width: 650px) {
  .slide.text-right,
  .slide.text-left {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
  }

  .slide.text-right .slide-media,
  .slide.text-left .slide-media {
    order: 1;
  }

  .slide.text-right .slide-copy,
  .slide.text-left .slide-copy {
    order: 2;
  }

  .slide-media {
    height: 300px;
    min-height: 0;
  }

  .slide-copy {
    padding: 30px;
  }
}
    .controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-top: 16px;
}

.controls > button {
  min-width: 48px;
  min-height: 48px;
  border: 0;
  border-radius: 999px;
  background: #171717;
  color: white;
  cursor: pointer;
  font-size: 22px;
}

.dots {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.dot {
  width: 9px;
  height: 9px;
  min-width: 9px;
  min-height: 9px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: #c5c5c5;
}

.dot.active {
  background: #171717;
}
    .project-menu {
  position: fixed;
  left: 50%;
  bottom: 16px;
  z-index: 20;
  transform: translateX(-50%);
  text-align: center;
}

.project-menu-toggle {
  padding: 10px 18px;
  border: 0;
  border-radius: 999px;
  background: #171717;
  color: white;
  cursor: pointer;
  font-size: 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.project-menu-panel {
  display: none;
  margin-bottom: 8px;
  padding: 8px;
  border-radius: 10px;
  background: white;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.project-menu.open .project-menu-panel {
  display: block;
}

.project-picker {
  min-width: 220px;
  padding: 8px 10px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  background: white;
  font-size: 14px;
}
  </style>
</head>

<body>
  <main class="carousel">
    <section id="slide" class="slide">
      <div class="message">Loading projects…</div>
    </section>

    <div class="controls">
      <button id="previous" type="button" aria-label="Previous photo">←</button>

      <div id="dots" class="dots"></div>

      <button id="next" type="button" aria-label="Next photo">→</button>
    </div>
  </main>

<script>
  const CONFIG = {
    githubOwner: "boofruit",
    githubRepository: "Portfolio_ImageScroll",
    branch: "main",
    rootFolder: "sets"
  };

  let projects = [];
  let activeProject = 0;
  let activePhoto = 0;

  const slideElement = document.getElementById("slide");
  const dotsElement = document.getElementById("dots");
const projectPicker = document.createElement("select");
projectPicker.className = "project-picker";
projectPicker.setAttribute("aria-label", "Choose project");

const projectMenu = document.createElement("div");
projectMenu.className = "project-menu";

const projectToggle = document.createElement("button");
projectToggle.className = "project-menu-toggle";
projectToggle.type = "button";
projectToggle.textContent = "Projects";
projectToggle.setAttribute("aria-expanded", "false");

const projectPanel = document.createElement("div");
projectPanel.className = "project-menu-panel";
projectPanel.appendChild(projectPicker);

projectMenu.appendChild(projectToggle);
projectMenu.appendChild(projectPanel);
document.body.appendChild(projectMenu);

projectToggle.addEventListener("click", () => {
  const isOpen = projectMenu.classList.toggle("open");

  projectToggle.setAttribute(
    "aria-expanded",
    String(isOpen)
  );
});
  function encodePath(path) {
    return path
      .split("/")
      .map(part => encodeURIComponent(part))
      .join("/");
  }

  async function getGitHubContents(path) {
    const url =
      `https://api.github.com/repos/` +
      `${CONFIG.githubOwner}/${CONFIG.githubRepository}/contents/` +
      `${encodePath(path)}?ref=${encodeURIComponent(CONFIG.branch)}`;

    const response = await fetch(url, {
      headers: {
        Accept: "application/vnd.github+json"
      }
    });

    if (!response.ok) {
      throw new Error(`GitHub request failed: ${response.status}`);
    }

    return response.json();
  }

  function isImage(filename) {
    return /\.(jpg|jpeg|png|gif|webp|avif)$/i.test(filename);
  }

  function sortFiles(a, b) {
    return a.name.localeCompare(b.name, undefined, {
      numeric: true,
      sensitivity: "base"
    });
  }

  function formatProjectName(name) {
    return name
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, character => character.toUpperCase());
  }

function normalizeTextPosition(position) {
  const validPositions = ["left", "right", "top", "bottom"];

  return validPositions.includes(position)
    ? position
    : "right";
}
function readZoom(value) {
  if (value === undefined || value === null || value === "") {
    return null;
  }

  const zoom = Number(value);

  return Number.isFinite(zoom) && zoom > 0
    ? zoom
    : null;
}
async function loadSlides(folder, contents) {
  const images = contents
    .filter(item => item.type === "file" && isImage(item.name))
    .sort(sortFiles);

  const contentFile = contents.find(
    item =>
      item.type === "file" &&
      item.name.toLowerCase() === "content.json"
  );

  if (!contentFile) {
    return images.map((image, index) => ({
      image: image.download_url,
      alt: `${formatProjectName(folder.name)} image ${index + 1}`,
      title: "",
      text: "",
      showText: false,
      textPosition: "right",
       zoom: null
    }));
    
  }

  try {
    const response = await fetch(contentFile.download_url);

    if (!response.ok) {
      throw new Error("Could not load content.json");
    }

    const content = await response.json();
    const entries = Array.isArray(content) ? content : content.slides;

    return entries
      .map((entry, index) => {
        const matchingImage = entry.image
          ? images.find(image => image.name === entry.image)
          : null;

        const hasText =
          Boolean(entry.title) ||
          Boolean(entry.text) ||
          Boolean(entry.linkUrl);

        const showText =
          entry.showText !== false && hasText;

        const hasImage = Boolean(matchingImage);

        if (!hasImage && !showText) {
          return null;
        }

        return {
          image: matchingImage
            ? matchingImage.download_url
            : null,

          alt:
            entry.alt ||
            `${formatProjectName(folder.name)} slide ${index + 1}`,

          title: entry.title || "",
          text: entry.text || "",
          showText,
          textPosition: showText
            ? normalizeTextPosition(entry.textPosition)
            : "right",
          zoom: readZoom(entry.zoom),
          linkText: entry.linkText || "",
          linkUrl: entry.linkUrl || ""
        };
      })
      .filter(Boolean);
  } catch (error) {
    console.warn(error);

    return images.map((image, index) => ({
      image: image.download_url,
      alt: `${formatProjectName(folder.name)} image ${index + 1}`,
      title: "",
      text: "",
      showText: false,
      textPosition: "right",
       zoom: null
    }));
  }
}

   

  async function discoverProjects() {
    const rootItems = await getGitHubContents(CONFIG.rootFolder);

    const folders = rootItems
      .filter(item => item.type === "dir")
      .sort((a, b) => a.name.localeCompare(b.name));

    const discoveredProjects = await Promise.all(
      folders.map(async folder => {
        const contents = await getGitHubContents(folder.path);
        const slides = await loadSlides(folder, contents);

        return {
          name: folder.name,
          slides
        };
      })
    );

    return discoveredProjects.filter(
      project => project.slides.length > 0
    );
  }

  function showMessage(message) {
    const messageElement = document.createElement("div");
    messageElement.className = "message";
    messageElement.textContent = message;

    slideElement.replaceChildren(messageElement);
  }

  function renderProjectPicker() {
    projectPicker.replaceChildren();

    projects.forEach((project, index) => {
      const option = document.createElement("option");

      option.value = index;
      option.textContent = formatProjectName(project.name);

      projectPicker.appendChild(option);
    });

    projectPicker.value = activeProject;
  }

function renderSlide() {
  const project = projects[activeProject];
  const slide = project.slides[activePhoto];

  const hasImage = Boolean(slide.image);
  const showText = slide.showText && (
    slide.title ||
    slide.text ||
    slide.linkUrl
  );

  slideElement.className = "slide";

  if (!hasImage && showText) {
    slideElement.classList.add("text-only");
  } else if (hasImage && !showText) {
    slideElement.classList.add("image-only");
  } else if (showText) {
    slideElement.classList.add(`text-${slide.textPosition}`);
  }

  slideElement.replaceChildren();

  if (hasImage) {
    const media = document.createElement("div");
    media.className = "slide-media";

   const image = document.createElement("img");

image.src = slide.image;
image.alt = slide.alt;

if (Number.isFinite(slide.zoom) && slide.zoom > 0) {
  image.style.transform = `scale(${slide.zoom})`;
  image.style.transformOrigin = "center center";
}
    media.appendChild(image);
    slideElement.appendChild(media);
  }

  if (showText) {
    const copy = document.createElement("div");
    copy.className = "slide-copy";

    if (slide.title) {
      const title = document.createElement("h1");
      title.textContent = slide.title;
      copy.appendChild(title);
    }

    if (slide.text) {
      const text = document.createElement("p");
      text.textContent = slide.text;
      copy.appendChild(text);
    }

    if (slide.linkUrl) {
      const link = document.createElement("a");

      link.href = slide.linkUrl;
      link.textContent = slide.linkText || "View project";
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      copy.appendChild(link);
    }

    slideElement.appendChild(copy);
  }

  dotsElement.replaceChildren();

  project.slides.forEach((_, index) => {
    const dot = document.createElement("button");

    dot.className =
      index === activePhoto ? "dot active" : "dot";

    dot.type = "button";
    dot.setAttribute("aria-label", `Go to slide ${index + 1}`);

    dot.addEventListener("click", () => {
      activePhoto = index;
      renderSlide();
    });

    dotsElement.appendChild(dot);
  });
}

  document.getElementById("previous").addEventListener("click", () => {
    const project = projects[activeProject];

    activePhoto =
      (activePhoto - 1 + project.slides.length) %
      project.slides.length;

    renderSlide();
  });

  document.getElementById("next").addEventListener("click", () => {
    const project = projects[activeProject];

    activePhoto =
      (activePhoto + 1) %
      project.slides.length;

    renderSlide();
  });

 projectPicker.addEventListener("change", event => {
  activeProject = Number(event.target.value);
  activePhoto = 0;

  projectMenu.classList.remove("open");
  projectToggle.setAttribute("aria-expanded", "false");

  renderSlide();
});

  async function startCarousel() {
    try {
      projects = await discoverProjects();

      if (projects.length === 0) {
        showMessage("No project folders with images were found.");
        return;
      }

      const requestedProject =
        new URLSearchParams(window.location.search).get("project");

      const requestedIndex = projects.findIndex(
        project => project.name === requestedProject
      );

      if (requestedIndex >= 0) {
        activeProject = requestedIndex;
      }

      renderProjectPicker();
      renderSlide();
    } catch (error) {
      console.error(error);
      showMessage("Unable to load projects from GitHub.");
    }
  }

  startCarousel();
</script>
</body>
</html>
